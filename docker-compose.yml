version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: school_admission_db
    environment:
      POSTGRES_DB: school_admission_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_admission_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=8080
      - DATABASE_URL=Host=db;Port=5432;Database=school_admission_db;Username=postgres;Password=postgrespassword
      - HOLD_DURATION_SECONDS=600
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "8080:8080"
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_admission_frontend
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080
    ports:
      - "5173:80"
    restart: on-failure

volumes:
  postgres_data:

